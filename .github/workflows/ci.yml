name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

# 검증 작업이 저장소에 쓰기 권한을 가질 필요는 없다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 외부 액션은 확인한 릴리스의 commit SHA로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Validate price editing and page preview
        run: |
          node scripts/test-price-grid.mjs
          node scripts/test-main-preview.mjs
          node scripts/test-video-urls.mjs
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      # 정적 결과는 Git에서 제외하므로 백엔드 검사 전에 화면/자료를 생성한다.
      - name: Copy frontend resources
        run: |
          mkdir -p backend/src/main/resources/static
          cp -R frontend/dist/. backend/src/main/resources/static/
      - name: Verify backend and package
        run: mvn -B verify
        working-directory: backend

# Apply with compose.yml when a same-host Cloudflare Tunnel or HTTPS reverse proxy
# publishes this service. The base Compose port remains bound to 127.0.0.1.
# 외부 브라우저의 HTTPS를 기준으로 Secure 쿠키를 설정한다. 이 파일이 Tunnel이나 인증서를 생성하지는 않는다.
services:
  admin:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      COOKIE_SECURE: "true"
      # Docker가 앱에 전달한 cloudflared의 실제 접속 주소만 일치시킨다.
      FORWARD_HEADERS_STRATEGY: native
      TRUSTED_PROXY_REGEX: ${TRUSTED_PROXY_REGEX:?Set a regex matching only the observed local Tunnel proxy address}
      REMOTE_IP_HEADER: CF-Connecting-IP
